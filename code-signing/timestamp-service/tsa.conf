[tsa]
default_tsa = tsa_config

[tsa_config]
serial = /state/tsa.serial
signer_cert = /tmp/tsa-runtime/tsa-leaf.crt
certs = /tmp/tsa-runtime/tsa-chain.crt
signer_key = /pki/lab-timestamp-authority.key
signer_digest = sha256
default_policy = 1.3.6.1.4.1.55555.1.1
digests = sha256, sha384, sha512
accuracy = secs:1, millisecs:500
clock_precision_digits = 3
ordering = yes
tsa_name = yes
ess_cert_id_chain = yes
ess_cert_id_alg = sha256
