name: internal-pki-lab

services:
  step-ca:
    image: smallstep/step-ca:0.30.2
    container_name: internal-pki-step-ca
    hostname: ca.lab.local
    restart: unless-stopped
    command:
      - step-ca
      - /home/step/config/ca.json
      - --password-file
      - /run/secrets/ca_password
    ports:
      # Bind only to this computer; the lab is not exposed on the LAN.
      - "127.0.0.1:9000:9000"
    volumes:
      - step-ca-data:/home/step
    secrets:
      - ca_password
    networks:
      pki-network:
        aliases:
          - ca.lab.local

  nginx-app-1:
    image: nginx:1.28-alpine
    container_name: internal-pki-nginx-app-1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
      - "127.0.0.1:8443:443"
    volumes:
      - ./nginx/app1/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/app1/certs:/etc/nginx/tls:ro
      - app1-acme-webroot:/var/www/acme:ro
    networks:
      pki-network:
        aliases:
          - app1.lab.local

  step-cli:
    image: smallstep/step-ca:0.30.2
    profiles:
      - tools
    entrypoint:
      - step
    volumes:
      - step-client-data:/home/step
      - ./step-ca/root_ca.crt:/roots/root_ca.crt:ro
      - ./nginx/app1/certs:/work
      - app1-acme-webroot:/var/www/acme
    networks:
      - pki-network

  nginx-app-2:
    image: nginx:1.28-alpine
    container_name: internal-pki-nginx-app-2
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:80"
      - "127.0.0.1:8445:443"
    volumes:
      - ./nginx/app2/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/app2/certs:/etc/nginx/tls:ro
      - app2-acme-webroot:/var/www/acme:ro
    networks:
      pki-network:
        aliases:
          - app2.lab.local

  step-cli-app-2:
    image: smallstep/step-ca:0.30.2
    profiles:
      - tools
    entrypoint:
      - step
    volumes:
      - step-client-app2-data:/home/step
      - ./step-ca/root_ca.crt:/roots/root_ca.crt:ro
      - ./nginx/app2/certs:/work
      - app2-acme-webroot:/var/www/acme
    networks:
      - pki-network

  nginx-app-1-incomplete-chain:
    image: nginx:1.28-alpine
    container_name: internal-pki-nginx-app-1-incomplete-chain
    profiles:
      - exercises
    ports:
      - "127.0.0.1:8444:443"
    volumes:
      - ./nginx/app1/nginx-leaf-only.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/app1/certs:/etc/nginx/tls:ro
    networks:
      pki-network:
        aliases:
          - app1-incomplete.lab.local

  nginx-app-1-key-mismatch:
    image: nginx:1.28-alpine
    profiles:
      - exercises
    command:
      - nginx
      - -t
      - -c
      - /etc/nginx/nginx.conf
    volumes:
      - ./nginx/app1/nginx-key-mismatch.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/app1/certs:/etc/nginx/tls:ro


networks:
  pki-network:
    name: internal-pki-lab
    driver: bridge

volumes:
  step-ca-data:
    name: internal-pki-lab-step-ca-data
  app1-certificates:
    name: internal-pki-lab-app1-certificates
  app2-certificates:
    name: internal-pki-lab-app2-certificates
  step-client-data:
    name: internal-pki-lab-step-client-data
  app1-acme-webroot:
    name: internal-pki-lab-app1-acme-webroot
  step-client-app2-data:
    name: internal-pki-lab-step-client-app2-data
  app2-acme-webroot:
    name: internal-pki-lab-app2-acme-webroot

secrets:
  ca_password:
    # Created interactively before CA initialization; ignored by Git.
    file: ./step-ca/secrets/ca-password.txt
