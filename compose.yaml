name: internal-pki-lab

services:
  step-ca:
    image: smallstep/step-ca:0.30.2
    container_name: internal-pki-step-ca
    hostname: ca.lab.local
    restart: unless-stopped
    command:
      - step-ca
      - /home/step/config/ca.json
      - --password-file
      - /run/secrets/ca_password
    ports:
      # Bind only to this computer; the lab is not exposed on the LAN.
      - "127.0.0.1:9000:9000"
    volumes:
      - step-ca-data:/home/step
    secrets:
      - ca_password
    networks:
      pki-network:
        aliases:
          - ca.lab.local

  nginx-app-1:
    image: nginx:1.28-alpine
    container_name: internal-pki-nginx-app-1
    restart: unless-stopped
    environment:
      TLS_CERTIFICATE_PATH: /etc/nginx/tls/app1-acme.crt
    ports:
      - "127.0.0.1:8081:80"
      - "127.0.0.1:8443:443"
    volumes:
      - ./nginx/app1/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/app1/certs:/etc/nginx/tls:ro
      - app1-acme-webroot:/var/www/acme:ro
      - ./scripts/nginx-certificate-watcher.sh:/docker-entrypoint.d/40-certificate-watcher.sh:ro
    networks:
      pki-network:
        aliases:
          - app1.lab.local

  step-cli:
    image: smallstep/step-ca:0.30.2
    profiles:
      - tools
    entrypoint:
      - step
    volumes:
      - step-client-data:/home/step
      - ./step-ca/root_ca.crt:/roots/root_ca.crt:ro
      - ./nginx/app1/certs:/work
      - app1-acme-webroot:/var/www/acme
    networks:
      - pki-network

  nginx-app-2:
    image: nginx:1.28-alpine
    container_name: internal-pki-nginx-app-2
    restart: unless-stopped
    environment:
      TLS_CERTIFICATE_PATH: /etc/nginx/tls/app2-acme.crt
    ports:
      - "127.0.0.1:8082:80"
      - "127.0.0.1:8445:443"
    volumes:
      - ./nginx/app2/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/app2/certs:/etc/nginx/tls:ro
      - app2-acme-webroot:/var/www/acme:ro
      - ./scripts/nginx-certificate-watcher.sh:/docker-entrypoint.d/40-certificate-watcher.sh:ro
    networks:
      pki-network:
        aliases:
          - app2.lab.local

  step-cli-app-2:
    image: smallstep/step-ca:0.30.2
    profiles:
      - tools
    entrypoint:
      - step
    volumes:
      - step-client-app2-data:/home/step
      - ./step-ca/root_ca.crt:/roots/root_ca.crt:ro
      - ./nginx/app2/certs:/work
      - app2-acme-webroot:/var/www/acme
    networks:
      - pki-network

  certificate-controller:
    build:
      context: ./controller
    image: internal-pki-controller:0.1.0
    container_name: internal-pki-certificate-controller
    restart: unless-stopped
    depends_on:
      step-ca:
        condition: service_healthy
      nginx-app-1:
        condition: service_started
      nginx-app-2:
        condition: service_started
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - ./controller/controller.toml:/config/controller.toml:ro
      - ./step-ca/root_ca.crt:/trust/root_ca.crt:ro
      - ./nginx/app1/certs:/certs/app1
      - ./nginx/app2/certs:/certs/app2
      - step-client-data:/state/app1
      - step-client-app2-data:/state/app2
      - app1-acme-webroot:/webroots/app1
      - app2-acme-webroot:/webroots/app2
    networks:
      - pki-network

  offline-root-ceremony:
    image: smallstep/step-ca:0.30.2
    profiles:
      - ceremony
    entrypoint:
      - step
    network_mode: none
    volumes:
      # Online CA material is read-only during normal ceremony operations.
      - step-ca-data:/online:ro
      - offline-root-data:/offline
      - code-signing-ca-data:/codesign
      - ./code-signing/templates:/codesign/templates:ro
      - ./step-ca/offline-root-backup:/backup
    secrets:
      - ca_password
      - code_signing_ca_password

  code-signing-ca:
    image: smallstep/step-ca:0.30.2
    container_name: internal-pki-code-signing-ca
    hostname: codesign-ca.lab.local
    restart: unless-stopped
    environment:
      STEPPATH: /codesign
    command:
      - step-ca
      - /codesign/config/ca.json
      - --password-file
      - /run/secrets/code_signing_ca_password
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - code-signing-ca-data:/codesign
      - ./code-signing/templates:/codesign/templates:ro
    secrets:
      - code_signing_ca_password
    networks:
      pki-network:
        aliases:
          - codesign-ca.lab.local

  code-signing-cli:
    image: smallstep/step-ca:0.30.2
    profiles:
      - tools
    entrypoint:
      - step
    volumes:
      - ./step-ca/root_ca.crt:/roots/root_ca.crt:ro
      - ./code-signing/publisher:/work
      - ./code-signing/templates:/templates:ro
    secrets:
      - code_signing_ca_password
      - publisher_key_password
    networks:
      - pki-network

  timestamp-cli:
    image: smallstep/step-ca:0.30.2
    profiles:
      - tools
    entrypoint:
      - step
    volumes:
      - ./step-ca/root_ca.crt:/roots/root_ca.crt:ro
      - ./code-signing/timestamp-authority:/work
      - ./code-signing/templates:/templates:ro
    secrets:
      - timestamp_provisioner_password
      - timestamp_key_password
    networks:
      - pki-network

  timestamp-authority:
    build:
      context: ./code-signing/timestamp-service
    image: internal-pki-timestamp-authority:0.1.0
    container_name: internal-pki-timestamp-authority
    restart: unless-stopped
    ports:
      - "127.0.0.1:9010:8080"
    volumes:
      - ./code-signing/timestamp-authority:/pki:ro
      - timestamp-authority-state:/state
    secrets:
      - timestamp_key_password
    networks:
      pki-network:
        aliases:
          - timestamp.lab.local

  artifact-signer:
    build:
      context: ./code-signing/tooling
    image: internal-pki-artifact-signer:0.1.0
    profiles:
      - tools
    working_dir: /workspace
    volumes:
      - ./code-signing/sample:/source:ro
      - ./code-signing/publisher:/publisher:ro
      - ./code-signing/artifacts:/artifacts
      - ./step-ca/root_ca.crt:/trust/root_ca.crt:ro
    secrets:
      - publisher_key_password
    networks:
      - pki-network

  tls-demo:
    build:
      context: ./demos/tls
    image: internal-pki-tls-demo:0.1.0
    profiles:
      - tools
    depends_on:
      step-ca:
        condition: service_healthy
      nginx-app-1:
        condition: service_started
      nginx-app-2:
        condition: service_started
      certificate-controller:
        condition: service_started
    volumes:
      - ./step-ca/root_ca.crt:/trust/root_ca.crt:ro
    networks:
      - pki-network

  nginx-app-1-incomplete-chain:
    image: nginx:1.28-alpine
    container_name: internal-pki-nginx-app-1-incomplete-chain
    profiles:
      - exercises
    ports:
      - "127.0.0.1:8444:443"
    volumes:
      - ./nginx/app1/nginx-leaf-only.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/app1/certs:/etc/nginx/tls:ro
    networks:
      pki-network:
        aliases:
          - app1-incomplete.lab.local

  nginx-app-1-key-mismatch:
    image: nginx:1.28-alpine
    profiles:
      - exercises
    command:
      - nginx
      - -t
      - -c
      - /etc/nginx/nginx.conf
    volumes:
      - ./nginx/app1/nginx-key-mismatch.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/app1/certs:/etc/nginx/tls:ro


networks:
  pki-network:
    name: internal-pki-lab
    driver: bridge

volumes:
  step-ca-data:
    name: internal-pki-lab-step-ca-data
  app1-certificates:
    name: internal-pki-lab-app1-certificates
  app2-certificates:
    name: internal-pki-lab-app2-certificates
  step-client-data:
    name: internal-pki-lab-step-client-data
  app1-acme-webroot:
    name: internal-pki-lab-app1-acme-webroot
  step-client-app2-data:
    name: internal-pki-lab-step-client-app2-data
  app2-acme-webroot:
    name: internal-pki-lab-app2-acme-webroot
  offline-root-data:
    name: internal-pki-lab-offline-root-data
  code-signing-ca-data:
    name: internal-pki-lab-code-signing-ca-data
  timestamp-authority-state:
    name: internal-pki-lab-timestamp-authority-state

secrets:
  ca_password:
    # Created interactively before CA initialization; ignored by Git.
    file: ./step-ca/secrets/ca-password.txt
  code_signing_ca_password:
    file: ./step-ca/secrets/code-signing-ca-password.txt
  publisher_key_password:
    file: ./step-ca/secrets/publisher-key-password.txt
  timestamp_provisioner_password:
    file: ./step-ca/secrets/timestamp-provisioner-password.txt
  timestamp_key_password:
    file: ./step-ca/secrets/timestamp-key-password.txt
