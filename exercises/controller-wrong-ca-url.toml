[controller]
interval_seconds = 900
health_host = "0.0.0.0"
health_port = 8080

[[certificate]]
id = "app1"
hostname = "app1.lab.local"
csr = "/certs/app1/app1.csr"
certificate = "/certs/app1/app1-acme.crt"
account_state = "/state/app1"
webroot = "/webroots/app1"
# Deliberately incorrect: the CA listens on 9000, not 9443.
ca_url = "https://ca.lab.local:9443"
root = "/trust/root_ca.crt"
provisioner = "lab-acme"
renew_before = "4h"
verify_url = "https://app1.lab.local"
operation_timeout_seconds = 120
