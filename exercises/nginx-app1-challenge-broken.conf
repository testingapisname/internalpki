events {}

http {
    server {
        listen 80;
        listen 443 ssl;
        server_name app1.lab.local;

        ssl_certificate     /etc/nginx/tls/app1-acme.crt;
        ssl_certificate_key /etc/nginx/tls/app1.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Deliberately break HTTP-01 while leaving HTTPS service healthy.
        location ^~ /.well-known/acme-challenge/ {
            return 404;
        }

        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"app1.lab.local","exercise":"challenge-broken"}\n';
        }
    }
}
