events {}

http {
    server {
        listen 443 ssl;
        server_name app1.lab.local;

        # Deliberately incomplete for the chain-building exercise.
        ssl_certificate     /etc/nginx/tls/app1-leaf-only.crt;
        ssl_certificate_key /etc/nginx/tls/app1.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location = /health {
            default_type application/json;
            return 200 '{"status":"misconfigured","chain":"leaf-only"}\n';
        }
    }
}
