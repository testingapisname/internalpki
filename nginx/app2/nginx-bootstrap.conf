events {}

http {
    server {
        listen 80;
        server_name app2.lab.local;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type text/plain;
            try_files $uri =404;
        }

        location = /health {
            default_type application/json;
            return 200 '{"status":"bootstrap","service":"app2.lab.local"}\n';
        }

        location / {
            default_type text/plain;
            return 200 'App2 is awaiting its first ACME certificate\n';
        }
    }
}
