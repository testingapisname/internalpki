events {}

http {
    server {
        listen 80;
        listen 443 ssl;
        server_name app2.lab.local;

        ssl_certificate     /etc/nginx/tls/app2-acme.crt;
        ssl_certificate_key /etc/nginx/tls/app2.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type text/plain;
            try_files $uri =404;
        }

        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"app2.lab.local"}\n';
        }

        location / {
            default_type text/plain;
            return 200 'Hello securely from app2.lab.local\n';
        }
    }
}
